<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#062E55" />
  <title>Global Talent Connections | Asistentes Virtuales y Talento Remoto para Empresas</title>
  <!-- La meta description la pone cada página vía el componente SEO (react-helmet).
       No se fija acá para no duplicarla. og:description sí queda abajo como fallback
       estático para los bots sociales que no ejecutan JS. -->
  <!-- Fuentes: el HTML arranca con los respaldos; cuando Fraunces y Montserrat ya
       bajaron (y SIEMPRE después de un frame pintado) se activa la clase que las
       aplica. En la misma sesión la clase va de entrada (no hay parpadeo). En el
       prerender no se activa: el HTML publicado tiene que arrancar sin ella. -->
  <script>
    (function () {
      var h = document.documentElement
      if (window.__PRERENDER_INJECTED) return
      function listo() { h.classList.add('fuentes-listas'); try { sessionStorage.setItem('gtc-fuentes', '1') } catch (e) {} }
      try { if (sessionStorage.getItem('gtc-fuentes') === '1') { h.classList.add('fuentes-listas'); return } } catch (e) {}
      if (!('fonts' in document)) { listo(); return }
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        Promise.all([document.fonts.load("330 1em Fraunces"), document.fonts.load("italic 330 1em Fraunces"), document.fonts.load("400 1em Montserrat")]).then(listo, listo)
      }) })
    })()
  </script>
  <!-- Única precarga: el póster del hero, que es el LCP. Las fuentes NO se precargan:
       se aplican después del primer pintado y las pide el script de arriba cuando ya
       hay un frame pintado, así no compiten con el póster ni con el HTML. -->
  <link rel="preload" as="image" href="/videos/hero-gtc-poster.webp" fetchpriority="high" />


  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Open Graph (fallback estático para bots que no ejecutan JS) -->

  <meta property="og:url" content="https://www.globaltalent-connections.com/" />
  <meta property="og:title" content="Global Talent Connections | Asistentes Virtuales y Talento Remoto para Empresas" />
  <meta property="og:description" content="Servicios de soporte para empresas en 11 áreas, prestados por un equipo de profesionales en Latinoamérica y coordinados por GTC. Una factura mensual, calidad y continuidad garantizadas." />
  <meta property="og:image" content="https://www.globaltalent-connections.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="es_ES" />
  <!-- Twitter Card (fallback) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Global Talent Connections | Asistentes Virtuales y Talento Remoto para Empresas" />
  <meta name="twitter:description" content="Servicios de soporte para empresas en 11 áreas, prestados por un equipo de profesionales en Latinoamérica y coordinados por GTC. Una factura mensual, calidad y continuidad garantizadas." />
  <meta name="twitter:image" content="https://www.globaltalent-connections.com/og-image.jpg" />

  <!-- Verificación dominios -->
  <meta name="facebook-domain-verification" content="tpk04qimy8h8hfg7o9evjn3cdd5g4t" />
  <meta name="msvalidate.01" content="EC1EEB6D6F39050A44D6F17DE0C48308" />

  <!-- Fonts: Fraunces (display editorial) + Montserrat (headlines) + Poppins (subtitles) + Lato (body) + Inter (UI) -->

  <!-- Medición y publicidad (Google Analytics 4 + Google Ads, LinkedIn Insight, Meta Pixel).
       NO se carga al entrar: la LSSI (art. 22.2) exige consentimiento previo para cookies
       que no son técnicas. Se carga solo si la persona aceptó en el aviso de cookies
       (src/components/shared/AvisoCookies.tsx), ahora o en una visita anterior. -->
  <script>
    window.__gtcCargarMedicion = function () {
      if (window.__gtcMedicionCargada) return;
      window.__gtcMedicionCargada = true;
      var s0 = document.getElementsByTagName('script')[0];
      function cargar(src) { var e = document.createElement('script'); e.async = true; e.src = src; s0.parentNode.insertBefore(e, s0); }

      // Google Analytics 4 + Google Ads
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', 'G-J6SJCJ1PK7');
      window.gtag('config', 'AW-18434607978');
      cargar('https://www.googletagmanager.com/gtag/js?id=G-J6SJCJ1PK7');

      // LinkedIn Insight Tag
      window._linkedin_partner_id = '9741425';
      window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
      window._linkedin_data_partner_ids.push(window._linkedin_partner_id);
      if (!window.lintrk) { window.lintrk = function (a, b) { window.lintrk.q.push([a, b]); }; window.lintrk.q = []; }
      cargar('https://snap.licdn.com/li.lms-analytics/insight.min.js');

      // Meta Pixel
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', '1296564382354555');
      window.fbq('track', 'PageView');
    };
    try {
      if (localStorage.getItem('gtc-cookies') === 'aceptadas') window.__gtcCargarMedicion();
    } catch (e) { /* sin almacenamiento: no se carga nada hasta que acepte */ }
  </script>
</head>
